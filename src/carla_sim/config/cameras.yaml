camera_front:
    type: camera
    topic: /carla/camera/image_raw          # same topic names the web GUI expects
    frame: camera_front_link
    pose: {x: 1.0, y: 0.0, z: 1.5, roll: 0, pitch: 0, yaw: 0}
    rate_hz: 10
    attributes: {image_size_x: 640, image_size_y: 480, fov: 90}

camera_rear:
  type: camera
  topic: /carla/camera_rear/image_raw
  frame: camera_rear_link
  pose: {x: -1.8, y: 0.0, z: 1.5, roll: 0, pitch: 0, yaw: 180}
  rate_hz: 10
  attributes: {image_size_x: 640, image_size_y: 480, fov: 90}

camera_left:
  type: camera
  topic: /carla/camera_left/image_raw
  frame: camera_left_link
  pose: {x: 0.5, y: 0.9, z: 1.5, roll: 0, pitch: 0, yaw: 90}
  rate_hz: 10
  attributes: {image_size_x: 640, image_size_y: 480, fov: 90}

camera_right:
  type: camera
  topic: /carla/camera_right/image_raw
  frame: camera_right_link
  pose: {x: 0.5, y: -0.9, z: 1.5, roll: 0, pitch: 0, yaw: -90}
  rate_hz: 10
  attributes: {image_size_x: 640, image_size_y: 480, fov: 90}
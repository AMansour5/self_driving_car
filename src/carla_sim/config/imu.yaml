imu:
  type: imu
  topic: /carla/imu/data
  frame: imu_link
  pose: {x: 0.0, y: 0.0, z: 0.5, roll: 0, pitch: 0, yaw: 0}
  attributes:                  # runs every sim tick (100 Hz)
    noise_accel_stddev_x: 0.05
    noise_accel_stddev_y: 0.05
    noise_accel_stddev_z: 0.05
    noise_gyro_stddev_x: 0.005
    noise_gyro_stddev_y: 0.005
    noise_gyro_stddev_z: 0.005
    noise_gyro_bias_z: 0.002   # constant yaw-rate bias, so integrated heading visibly drifts

compass:
  topic: /carla/compass/imu          # Imu msg with orientation (yaw only) and its covariance
  frame: imu_link
  rate_hz: 10
  yaw_noise_std_deg: 3.0
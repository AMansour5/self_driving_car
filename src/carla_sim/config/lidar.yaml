lidar:
    type: lidar
    topic: /carla/lidar/points
    frame: lidar_link
    pose: {x: 0.0, y: 0.0, z: 2.2, roll: 0, pitch: 0, yaw: 0}
    rate_hz: 10                  # full scans per second; the node sets rotation_frequency from this
    attributes:                  # 32 ch x 1800 pts/rev x 10 Hz ~ 600k points/s
      channels: 32
      range: 100
      points_per_second: 600000
      upper_fov: 10
      lower_fov: -30
      noise_stddev: 0.02
      dropoff_general_rate: 0.05